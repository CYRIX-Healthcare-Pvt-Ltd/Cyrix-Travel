<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ride on Google Maps</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #0b0d10; --muted: #5b6270; --line: #e3e6eb; --red: #da251d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0d10; --ink: #f6f7f9; --muted: #9aa1ad; --line: #23272e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; }
  header { flex: none; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); }
  .pt { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; }
  .pt b { flex: none; width: 3.2em; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .pt span { font: 600 17px/1.3 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.01em; }
  .pt i { flex: none; width: 9px; height: 9px; border-radius: 50%; align-self: center; }
  .from i { border: 2px solid var(--ink); }
  .to i { background: var(--red); }
  iframe { flex: 1; width: 100%; border: 0; }
  .bad { margin: auto; padding: 16px; text-align: center; font-weight: 600; }
</style>
</head>
<body>
<script>
  /*
    Travel's Google Maps button opens this page (the user, 11 Nov: "new browser loading then going to map app"). Any
    google.com/maps link, however opened, Android's Chrome hands to the Maps app, and the app turns the ride's points
    into the nearest business's name. Here Google's map is shown inside Travel's own page, where the app cannot take it,
    with the ride's From and To written above it as numbers, so one screenshot has the points and Google's route km
    together and can be matched. #from=lat,lng&to=lat,lng; anything else is refused.
  */
  (function () {
    var q = {};
    location.hash.slice(1).split('&').forEach(function (kv) { var p = kv.split('='); q[p[0]] = decodeURIComponent(p[1] || ''); });
    var ok = /^-?\d{1,2}\.\d+,-?\d{1,3}\.\d+$/;
    if (!ok.test(q.from || '') || !ok.test(q.to || '')) {
      document.body.innerHTML = '<p class="bad">This link is not a ride on Google Maps.</p>';
      return;
    }
    var fmt = function (s) { return s.split(',').map(function (n) { return Number(n).toFixed(6); }).join(', '); };
    var head = document.createElement('header');
    head.innerHTML =
      '<div class="pt from"><i></i><b>From</b><span>' + fmt(q.from) + '</span></div>' +
      '<div class="pt to"><i></i><b>To</b><span>' + fmt(q.to) + '</span></div>';
    var map = document.createElement('iframe');
    map.title = 'Google Maps';
    map.referrerPolicy = 'no-referrer-when-downgrade';
    map.src = 'https://www.google.com/maps?output=embed&dirflg=d&saddr=' + encodeURIComponent(q.from) + '&daddr=' + encodeURIComponent(q.to);
    document.body.appendChild(head);
    document.body.appendChild(map);
  })();
</script>
</body>
</html>
