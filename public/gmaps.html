<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Google Maps</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 600 16px/1.4 system-ui, sans-serif;
    background: #f6f7f9; color: #0b0d10; }
  @media (prefers-color-scheme: dark) { body { background: #0b0d10; color: #f6f7f9; } }
  p { margin: 0; padding: 16px; text-align: center; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: #da251d;
    animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
</style>
</head>
<body>
<p><span class="dot"></span>Opening Google Maps…</p>
<script>
  /*
    Travel's Google Maps button lands here (the user, 11 Nov: "still opening in map app for android"). Android's Chrome
    hands a google.com/maps link to the Maps app when it comes from a press, and the app turns the ride's points into
    the nearest business's name. Loaded from here, a moment later and without a press, Chrome keeps it in the browser,
    where the points stay as numbers and the screenshot can be matched. Only a Google Maps directions link is followed.
  */
  (function () {
    var target = decodeURIComponent(location.hash.slice(1) || '');
    if (!/^https:\/\/www\.google\.com\/maps\/dir\/-?\d{1,2}\.\d+,-?\d{1,3}\.\d+\/-?\d{1,2}\.\d+,-?\d{1,3}\.\d+\/data=!4m2!4m1!3e0$/.test(target)) {
      document.querySelector('p').textContent = 'This link is not a ride on Google Maps.';
      return;
    }
    setTimeout(function () { location.replace(target); }, 1200);
  })();
</script>
</body>
</html>
